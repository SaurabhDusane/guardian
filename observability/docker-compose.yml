# Local viewing stack for Guardian's optional exporters.
#
#   docker compose -f observability/docker-compose.yml up -d
#
# Marquez (OpenLineage):  API http://localhost:5000, UI http://localhost:3000
# Tempo (OTLP traces):     OTLP/HTTP http://localhost:4318, API http://localhost:3200
# Grafana (trace viewer):  http://localhost:3001 (anonymous admin, Tempo preconfigured)
#
# Point Guardian at it:
#   export GUARDIAN_OPENLINEAGE_URL=http://localhost:5000
#   export GUARDIAN_OTEL=otlp OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#
# Image tags default to `latest`; pin them with MARQUEZ_VERSION, TEMPO_VERSION and
# GRAFANA_VERSION for reproducible setups.
name: guardian-observability

services:
  marquez-db:
    image: postgres:16
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 20

  marquez-api:
    image: marquezproject/marquez:${MARQUEZ_VERSION:-latest}
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"
      - "5001:5001"

  marquez-web:
    image: marquezproject/marquez-web:${MARQUEZ_VERSION:-latest}
    depends_on:
      - marquez-api
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "3000:3000"

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-latest}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"  # Tempo HTTP API (Grafana queries it)
      - "4318:4318"  # OTLP over HTTP (Guardian exports here)

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    depends_on:
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3001:3000"

volumes:
  marquez-db:
  tempo-data:
