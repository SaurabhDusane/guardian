# Demo pipeline: messy e-commerce orders -> daily revenue by region and segment.
#
# merge_key identifies a row across runs; replay upserts recovered rows by it.
#
# b8_aggregate normally reads b6_enrich. If b6 is DEGRADED (failed validation or
# crashed) or taken OUT, b8 reads b5_normalize instead, reshaped by b5_to_b6_shape.
# b7_customers also reads b5_normalize, so b5 feeds two dependents.
#
# Versions: one block per DAG role declares v1 (active), v2 (a genuine improvement,
# identical on well-formed data) and v_bad (subtly wrong: an off-by-one), for shadow
# promotion (`guardian shadow start <block> <version>`).
#
# Diagnosis: `guardian diagnose <block>` works for every block. Values of a block's
# `redact_columns` are masked in anything sent to an LLM (here: customer emails). Add
# `auto_diagnose: true` to a block to diagnose it automatically after a ROLLBACK
# (needs GUARDIAN_LLM_PROVIDER and GUARDIAN_LLM_MODEL; it never fails a run).
#
# Every block declares its unit tests (`tests`): a proposed fix must pass them, plus a
# shadow run, before the agent may open a pull request (`guardian propose <block>`).
#
# DAG roles (tests pick blocks by role, see tests/helpers/roles.py):
#   source: b1   leaf: b7, b8   fallback_protected: b6   fallback_source: b5
#   multi_dependent: b5   unprotected: b1-b5
name: demo
blocks:
  - name: b1_ingest
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b1_ingest]"]
    load: demo.blocks:load_orders  # params go to the loader; versions get its frame
    versions:
      v1: demo.blocks:ingest
      v2: demo.blocks:ingest_v2
      v_bad: demo.blocks:ingest_bad
    active: v1
    merge_key: [order_id]
    redact_columns: [email]
    schema: demo.schemas:RawSchema
    quarantine_threshold: 0.2
    params:
      loader: guardian.demo.data_gen:SyntheticOrdersLoader  # swap for a real DatasetLoader
      rows: 500
      seed: 42

  - name: b2_parse
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b2_parse]"]
    versions:
      v1: demo.blocks:parse
      v2: demo.blocks:parse_v2
      v_bad: demo.blocks:parse_bad
    active: v1
    merge_key: [order_id]
    inputs: [b1_ingest]
    schema: demo.schemas:ParsedSchema
    quarantine_threshold: 0.2

  - name: b3_standardize
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b3_standardize]"]
    fn: demo.blocks:standardize
    merge_key: [order_id]
    inputs: [b2_parse]
    schema: demo.schemas:StandardizedSchema
    quarantine_threshold: 0.2

  - name: b4_clean
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b4_clean]"]
    fn: demo.blocks:clean
    merge_key: [order_id]
    redact_columns: [email, email_clean]
    inputs: [b3_standardize]
    schema: demo.schemas:CleanSchema
    quarantine_threshold: 0.2

  - name: b5_normalize
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b5_normalize]"]
    versions:
      v1: demo.blocks:normalize
      v2: demo.blocks:normalize_v2
      v_bad: demo.blocks:normalize_bad
    active: v1
    merge_key: [order_id]
    inputs: [b4_clean]
    schema: demo.schemas:NormalizedSchema
    quarantine_threshold: 0.1

  - name: b6_enrich
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b6_enrich]"]
    versions:
      v1: demo.blocks:enrich
      v2: demo.blocks:enrich_v2
      v_bad: demo.blocks:enrich_bad
    active: v1
    merge_key: [order_id]
    inputs: [b5_normalize]
    schema: demo.schemas:EnrichedSchema
    quarantine_threshold: 0.1

  - name: b7_customers
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b7_customers]"]
    versions:
      v1: demo.blocks:customers
      v2: demo.blocks:customers_v2
      v_bad: demo.blocks:customers_bad
    active: v1
    merge_key: [customer_id]
    inputs: [b5_normalize]
    schema: demo.schemas:CustomerSchema
    quarantine_threshold: 0.1
    annotate_quality: true  # opt-in: adds _guardian_quality (FRESH/STALE/FALLBACK)

  - name: b8_aggregate
    tests: ["tests/demo/test_block_contracts.py::test_block_contract[b8_aggregate]"]
    fn: demo.blocks:aggregate
    merge_key: [order_date, region, segment]
    inputs: [b6_enrich]
    schema: demo.schemas:AggregateSchema
    quarantine_threshold: 0.0
    fallbacks:
      - replaces: b6_enrich
        source: b5_normalize
        adapter: demo.blocks:b5_to_b6_shape
