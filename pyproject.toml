[project]
name = "guardian"
version = "0.1.0"
description = "Self-healing maintenance layer for data pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pandera>=0.20",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dagster = ["dagster>=1.8", "dagster-webserver>=1.8"]
agent = ["anthropic>=1.0"]
observability = ["opentelemetry-exporter-otlp-proto-http>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
guardian = "guardian.runner.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".guardian"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast suite. Full suite: -m "not llm and not docker".
addopts = "-ra --strict-markers -m 'not slow and not llm and not docker'"
markers = [
    "slow: long-running tests (the Dagster runner, exhaustive per-role scenarios, property tests); in the full suite",
    "dagster: needs the dagster extra (every Dagster runner scenario is also slow)",
    "llm: calls a real LLM API (network and an API key); also needs GUARDIAN_LLM_LIVE=1",
    "docker: needs Docker (the local observability stack)",
]
